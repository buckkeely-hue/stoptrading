<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StopTrading — Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 40px 36px;
    width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo { font-size: 22px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
  .sub  { font-size: 13px; color: #64748b; margin-bottom: 32px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; letter-spacing: .04em; }
  input[type=password] {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    transition: border-color .15s;
  }
  input[type=password]:focus { border-color: #38bdf8; }
  button {
    width: 100%;
    margin-top: 20px;
    background: #0369a1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    padding: 11px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #0284c7; }
  .err {
    display: none;
    margin-top: 14px;
    background: rgba(239,68,68,.15);
    border: 1px solid rgba(239,68,68,.3);
    border-radius: 6px;
    color: #f87171;
    font-size: 13px;
    padding: 9px 12px;
    text-align: center;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">StopTrading</div>
  <div class="sub">Automated penny stock day trading</div>
  <form id="form">
    <label>PASSWORD</label>
    <input type="password" id="pw" autofocus autocomplete="current-password" placeholder="Enter password">
    <button type="submit">Sign in</button>
    <div class="err" id="err">Incorrect password</div>
  </form>
  <a href="/reset" style="display:block;text-align:center;margin-top:18px;font-size:13px;color:#475569;text-decoration:none;" onmouseover="this.style.color='#38bdf8'" onmouseout="this.style.color='#475569'">Forgot password?</a>
</div>
<script>
document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  var pw = document.getElementById('pw').value;
  var err = document.getElementById('err');
  err.style.display = 'none';
  fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin',
    body: JSON.stringify({password: pw})
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok) {
      window.location.href = '/';
    } else {
      err.style.display = 'block';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  }).catch(function() {
    err.textContent = 'Server error — try again';
    err.style.display = 'block';
  });
});
</script>
</body>
</html>
