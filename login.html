<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StopTrading — Login</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0f172a;
    color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 40px 36px;
    width: 340px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  .logo { font-size: 22px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
  .sub  { font-size: 13px; color: #64748b; margin-bottom: 32px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; letter-spacing: .04em; }
  input[type=password] {
    width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    transition: border-color .15s;
  }
  input[type=password]:focus { border-color: #38bdf8; }
  button {
    width: 100%;
    margin-top: 20px;
    background: #0369a1;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    padding: 11px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #0284c7; }
  .err {
    display: none;
    margin-top: 14px;
    background: rgba(239,68,68,.15);
    border: 1px solid rgba(239,68,68,.3);
    border-radius: 6px;
    color: #f87171;
    font-size: 13px;
    padding: 9px 12px;
    text-align: center;
  }
  .ok {
    display: none;
    margin-top: 14px;
    background: rgba(34,197,94,.12);
    border: 1px solid rgba(34,197,94,.3);
    border-radius: 6px;
    color: #86efac;
    font-size: 13px;
    padding: 9px 12px;
    text-align: center;
  }
  .recovery-card {
    display: none;
    margin-top: 20px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 20px;
  }
  .recovery-card h3 { font-size: 13px; color: #f59e0b; margin-bottom: 12px; }
  .recovery-card input {
    width: 100%;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    margin-bottom: 8px;
    font-family: monospace;
  }
  .recovery-card input:focus { border-color: #f59e0b; }
  .recovery-card button {
    background: #b45309;
    margin-top: 4px;
  }
  .recovery-card button:hover { background: #d97706; }
  .hint { font-size: 11px; color: #475569; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">StopTrading</div>
  <div class="sub">Automated penny stock day trading</div>
  <form id="form">
    <label>PASSWORD</label>
    <input type="password" id="pw" autofocus autocomplete="current-password" placeholder="Enter password">
    <button type="submit">Sign in</button>
    <div class="err" id="err">Incorrect password</div>
  </form>
  <div style="display:flex;gap:16px;margin-top:18px;justify-content:center">
    <a href="/reset" style="font-size:13px;color:#475569;text-decoration:none;" onmouseover="this.style.color='#38bdf8'" onmouseout="this.style.color='#475569'">Forgot password?</a>
    <span style="color:#334155">·</span>
    <a href="#" onclick="toggleRecovery();return false;" style="font-size:13px;color:#475569;text-decoration:none;" onmouseover="this.style.color='#f59e0b'" onmouseout="this.style.color='#475569'">Lost access?</a>
  </div>

  <div class="recovery-card" id="recovery-card">
    <h3>🔑 Emergency Recovery</h3>
    <div class="hint" id="recovery-hint">Loading recovery code hint…</div>
    <input type="text" id="rec-code" placeholder="Recovery code" autocomplete="off">
    <input type="password" id="rec-pw" placeholder="New password (min 8 chars)" autocomplete="new-password">
    <input type="password" id="rec-pw2" placeholder="Confirm new password" autocomplete="new-password">
    <button onclick="doRecovery()">Set New Password</button>
    <div class="err" id="rec-err"></div>
    <div class="ok"  id="rec-ok">Password updated — redirecting…</div>
  </div>
</div>
<script>
document.getElementById('form').addEventListener('submit', function(e) {
  e.preventDefault();
  var pw = document.getElementById('pw').value;
  var err = document.getElementById('err');
  err.style.display = 'none';
  fetch('/api/login', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    credentials: 'same-origin',
    body: JSON.stringify({password: pw})
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok) {
      window.location.href = '/';
    } else {
      err.style.display = 'block';
      document.getElementById('pw').value = '';
      document.getElementById('pw').focus();
    }
  }).catch(function() {
    err.textContent = 'Server error — try again';
    err.style.display = 'block';
  });
});

function toggleRecovery() {
  var card = document.getElementById('recovery-card');
  var visible = card.style.display === 'block';
  card.style.display = visible ? 'none' : 'block';
  if (!visible) {
    fetch('/api/reset-password/recovery-hint')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        document.getElementById('recovery-hint').textContent = 'Recovery code ends in: ' + (d.hint || '????');
      }).catch(function() {});
    document.getElementById('rec-code').focus();
  }
}

function doRecovery() {
  var code = document.getElementById('rec-code').value.trim();
  var pw   = document.getElementById('rec-pw').value;
  var pw2  = document.getElementById('rec-pw2').value;
  var err  = document.getElementById('rec-err');
  var ok   = document.getElementById('rec-ok');
  err.style.display = 'none';
  ok.style.display  = 'none';
  if (!code) { err.textContent = 'Enter your recovery code.'; err.style.display = 'block'; return; }
  if (pw.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.style.display = 'block'; return; }
  if (pw !== pw2)    { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }
  fetch('/api/reset-password/emergency', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({recovery_code: code, password: pw})
  }).then(function(r) { return r.json(); }).then(function(d) {
    if (d.ok) {
      ok.style.display = 'block';
      setTimeout(function() { window.location.href = '/login'; }, 1500);
    } else {
      err.textContent = d.error || 'Invalid recovery code.';
      err.style.display = 'block';
    }
  });
}
</script>
</body>
</html>
